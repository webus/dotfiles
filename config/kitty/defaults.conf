font_size 13.0

copy_on_select clipboard

cursor_trail 3
cursot_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

map cmd+t launch --type=tab --cwd=current
map cmd+enter launch --cwd=current

enabled_layouts splits, stack
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+- launch --location=hsplit --cwd=current

# BEGIN_KITTY_FONTS
font_family      family='0xProto Nerd Font Mono' postscript_name=0xProtoNFM
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

disable_ligatures always

text_composition_strategy legacy
macos_thicken_font 0.5

allow_remote_control yes

shell_integration no-cursor
cursor_shape block

scrollback_lines 1000000

